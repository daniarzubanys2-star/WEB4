<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --green: #0F6B5F;
      --amber: #F2A93B;
      --ink: #16302B;
      --field: #F4F7F5;
      --line: #E6EFEC;
      --bs-body-font-family: "Montserrat", system-ui, sans-serif;
      --bs-body-color: var(--ink);
    }
    body { background: var(--line); font-family: "Montserrat", system-ui, sans-serif; color: var(--ink); }
    .ticket-card {
      background: #fff; border: 0; border-radius: 1.25rem; overflow: hidden;
      box-shadow: 0 1rem 2.5rem rgba(22, 48, 43, .15);
    }
    .ticket-head { background: var(--green); color: #fff; padding: 1.5rem 2rem; }
    .ticket-head h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .ticket-body { padding: 2rem; }
    @media (max-width: 575.98px) {
      .ticket-head { padding: 1rem 1.25rem; }
      .ticket-head h1 { font-size: 1.1rem; }
      .ticket-body { padding: 1.25rem; }
    }
    .form-label, legend.form-label { font-size: .8rem; font-weight: 600; margin-bottom: .4rem; }
    .form-control, .form-select, .input-group-text {
      background-color: var(--field); border: 1px solid var(--line);
      border-radius: .75rem; font-size: .85rem; color: var(--ink);
    }
    .form-floating > label { font-size: .8rem; color: #6b817c; }
    .form-control:focus, .form-select:focus {
      border-color: var(--green); box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .2); background-color: #fff;
    }
    .input-group > .input-group-text {
      background: var(--green); color: #fff; font-weight: 600; border-color: var(--green);
      border-radius: .75rem 0 0 .75rem;
    }
    .input-group > .form-control { border-radius: 0 .75rem .75rem 0; }
    .form-check-input:checked { background-color: var(--green); border-color: var(--green); }
    .form-check-input:focus { border-color: var(--green); box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .25); }
    .form-check-label { font-size: .8rem; }
    /* One way / Round trip segmented control */
    .trip-switch .btn { font-size: .8rem; font-weight: 600; padding: .45rem 1.1rem; }
    .trip-switch .btn-outline-success {
      --bs-btn-color: var(--green); --bs-btn-border-color: var(--green);
      --bs-btn-hover-bg: var(--line); --bs-btn-hover-color: var(--green);
      --bs-btn-active-bg: var(--green); --bs-btn-active-border-color: var(--green); --bs-btn-active-color: #fff;
    }
    .trip-switch .btn:first-of-type { border-radius: 2rem 0 0 2rem; }
    .trip-switch .btn:last-of-type { border-radius: 0 2rem 2rem 0; }
    .btn-find, .btn-clear { border-radius: 2rem; font-weight: 700; font-size: .85rem; padding: .6rem 1.5rem; }
    .btn-find { background: var(--amber); border-color: var(--amber); color: #fff; }
    .btn-find:hover, .btn-find:focus-visible { background: #d9942c; border-color: #d9942c; color: #fff; }
    .btn-clear { background: #fff; border: 1px solid var(--ink); color: var(--ink); }
    .btn-clear:hover, .btn-clear:focus-visible { background: var(--line); color: var(--ink); border-color: var(--ink); }
    .btn:focus-visible { box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .35); }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        <section class="ticket-card">
          <div class="ticket-head"><h1>Book a train ticket</h1></div>
          <form class="ticket-body" action="#" method="get">

            <fieldset class="mb-3">
              <legend class="visually-hidden">Trip type</legend>
              <div class="btn-group trip-switch" role="group" aria-label="Trip type">
                <input type="radio" class="btn-check" name="trip" id="oneway" value="one-way" checked>
                <label class="btn btn-outline-success" for="oneway">One way</label>
                <input type="radio" class="btn-check" name="trip" id="round" value="round-trip">
                <label class="btn btn-outline-success" for="round">Round trip</label>
              </div>
            </fieldset>

            <div class="row g-3 mb-3">
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from" placeholder="From" value="Astana" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to" placeholder="To" value="Almaty" required>
                  <label for="to">To</label>
                </div>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-12 col-md-4">
                <label for="departure" class="form-label">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-12 col-md-4">
                <label for="return" class="form-label">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-12 col-md-4">
                <label for="passengers" class="form-label">Passengers</label>
                <select class="form-select" id="passengers" name="passengers">
                  <option value="1" selected>1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>
            </div>

            <fieldset class="mb-3">
              <legend class="form-label">Carriage class</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="class" id="seat" value="seat" required>
                <label class="form-check-label" for="seat">Seat</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="class" id="coupe" value="coupe" checked required>
                <label class="form-check-label" for="coupe">Coupé</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="class" id="sleeper" value="sleeper" required>
                <label class="form-check-label" for="sleeper">Sleeper</label>
              </div>
            </fieldset>

            <div class="row g-3 mb-3">
              <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text" id="phone-code">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" aria-describedby="phone-code" autocomplete="tel-national" required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
              </div>
            </div>

            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
              <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agree" name="agree" value="yes" required>
              <label class="form-check-label" for="agree">I agree with the carriage rules</label>
            </div>

            <!-- HTML order: Clear, then Find trains. On phones Find trains is shown first via order-* -->
            <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-2">
              <button type="reset" class="btn btn-clear order-2 order-sm-1">Clear</button>
              <button type="submit" class="btn btn-find order-1 order-sm-2">Find trains</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
